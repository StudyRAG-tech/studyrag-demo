<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0F1B2D">
<title>StudyRAG Mobile — demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Demo di StudyRAG Online sul telefono, con dati di esempio e AI simulata.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* =====================================================================
   StudyRAG Mobile — prototipo. Token Campus e movimento 1.1 presi da views/theme.css e views/motion.css.
   Curve: ease-out per apparire, ease-in per uscire, ease-in-out per muoversi. Solo transform, opacity, clip-path,
   stroke-dashoffset. Griglia 4/8 px, margini 16 px, tocchi da 44 px.
   ===================================================================== */
:root{
  --pbg:#EEF2F7;--pfg:#0F1B2D;--pmu:#536379;--pln:#DCE3EC;--psf:#FFFFFF;--pac:#0F766E;
  --eo:cubic-bezier(.32,.72,0,1);--ei:cubic-bezier(.55,0,1,.45);--eio:cubic-bezier(.77,0,.175,1);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pbg:#070C16;--pfg:#E6EDF7;--pmu:#97A6BB;--pln:#26334A;--psf:#101828;--pac:#2DD4BF;color-scheme:dark}}
:root[data-theme="dark"]{--pbg:#070C16;--pfg:#E6EDF7;--pmu:#97A6BB;--pln:#26334A;--psf:#101828;--pac:#2DD4BF;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--pbg);color:var(--pfg);font-family:Manrope,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;padding:28px 16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--pac);outline-offset:2px}
.page{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:32px;justify-items:center}
@media (max-width:560px){html.emb .dev{position:relative;inset:auto;width:100%;height:max(640px,100vh)}}
.cap{margin:0;max-width:390px;text-align:center;color:var(--pmu);font-size:13.5px}
.cap b{color:var(--pfg)}
.side{display:flex;flex-direction:column;gap:16px;min-width:0;width:100%;max-width:640px}
.side h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.025em}
.side .lead{margin:6px 0 0;color:var(--pmu)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl b{font-size:13px;color:var(--pmu);min-width:76px}
.pp{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--pln);background:var(--psf);font-weight:700;font-size:13.5px}
.pp[aria-pressed="true"]{background:var(--pfg);color:var(--pbg);border-color:var(--pfg)}
.note{background:var(--psf);border:1px solid var(--pln);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.note h2{margin:0;font-size:16px;font-weight:800}
.note ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.note li{padding-top:10px;border-top:1px solid var(--pln);font-size:14px}
.note li:first-child{border-top:0;padding-top:0}
.note li b{display:block;font-size:14.5px}
.note li span{color:var(--pmu)}

/* ================= telefono ================= */
.dev{width:390px;height:min(844px,max(640px,calc(100dvh - 130px)));border-radius:48px;padding:10px;background:#05080F;box-shadow:0 30px 80px rgba(5,8,15,.35),inset 0 0 0 1px rgba(255,255,255,.07);flex:none}
.app{--r:18px;position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:Manrope,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;isolation:isolate;-webkit-font-smoothing:antialiased}
/* token Campus (ui.TOKENS): notte e giorno */
.th-d{--bg:#0B1220;--sf:#131C2E;--sf2:#1B2639;--ln:#26334A;--ln2:#34445E;--edge:#6E7F99;--ink:#E6EDF7;--mu:#97A6BB;
  --ac:#2DD4BF;--onac:#042F2B;--acs:#0F2E2E;--acl:#1F5F59;--warn:#FBBF24;--warns:#2D2310;--warnl:#5C4714;--ok:#4ADE80;--oks:#0F2A1A;--bad:#FB7185;--bads:#2E1219;
  --sh:rgba(0,0,0,.28);--nav:#131C2E;--navln:#26334A;--navink:#AEBBCD;--navhi:#FFFFFF;--navac:#2DD4BF;--navonac:#042F2B;
  --scrim:rgba(2,6,14,.62);--s0:#818CF8;--s1:#FBBF24;--s2:#F472B6;--s3:#34D399;--ga:#0F766E;--gb:#0369A1;color-scheme:dark}
.th-l{--bg:#F2F5F9;--sf:#FFFFFF;--sf2:#EAEFF5;--ln:#DCE3EC;--ln2:#C3CEDB;--edge:#7A889C;--ink:#0F1B2D;--mu:#536379;
  --ac:#0F766E;--onac:#FFFFFF;--acs:#DDF3F0;--acl:#9ED8D0;--warn:#A44A08;--warns:#FEF3C7;--warnl:#F3D58A;--ok:#15703A;--oks:#DCFCE7;--bad:#BE123C;--bads:#FFE4E6;
  --sh:rgba(15,27,45,.07);--nav:#0F1B2D;--navln:#24324A;--navink:#AEBBCD;--navhi:#FFFFFF;--navac:#2DD4BF;--navonac:#042F2B;
  --scrim:rgba(15,27,45,.45);--s0:#4F46E5;--s1:#D97706;--s2:#DB2777;--s3:#059669;--ga:#0F766E;--gb:#0369A1;color-scheme:light}
@media (max-width:560px){
  body{padding:0}.cap{display:none}.page{display:block}
  .dev{position:fixed;inset:0;width:auto;height:auto;border-radius:0;padding:0;background:none;box-shadow:none}
  .app{border-radius:0}
}

/* ---------- banda in alto: come la barra della versione desktop (blu notte, segno con alone, materia) ---------- */
.band{position:absolute;left:0;right:0;top:0;z-index:8;background:var(--nav);color:var(--navhi);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 6px 10px 16px;display:grid;grid-template-columns:auto auto minmax(0,1fr) 44px;gap:8px;align-items:center}
.dev:not(.full) .band{padding-top:16px}
.mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#2DD4BF,#38BDF8);color:#0F1B2D;
  font-weight:800;font-size:16px;box-shadow:0 2px 8px rgba(45,212,191,.35)}
.dmo{min-height:44px;min-width:44px;display:grid;place-items:center;border:0;background:none;padding:0}
.dmo span{font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:3px 7px;border-radius:99px;border:1px solid var(--navln);color:var(--navac);background:rgba(45,212,191,.1)}
.chip{justify-self:start;max-width:100%;min-width:0;height:44px;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border-radius:12px;
  border:1px solid var(--navln);background:rgba(255,255,255,.07);color:var(--navhi);font-weight:700;font-size:14.5px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip svg{color:var(--navink);flex:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.gear{width:44px;height:44px;border:0;border-radius:12px;background:none;color:var(--navink);display:grid;place-items:center}
.gear:active{background:rgba(255,255,255,.08)}
.scr{position:absolute;left:0;right:0;bottom:0;top:var(--band,60px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.scr::-webkit-scrollbar{display:none}
.subw{position:sticky;top:0;z-index:5;padding:12px 16px 8px;background:linear-gradient(var(--bg) 80%,transparent)}
.view{padding:16px 16px 0;display:flex;flex-direction:column;gap:16px}
.subw+.view{padding-top:8px}

/* i blocchi non si schiacciano mai dentro le colonne */
.view>*,.shb>*,.stack>.pg>*{flex:none}

/* ---------- intestazione di pagina (ui.page_header): occhiello a pillola, titolo con accento ---------- */
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.eye{display:inline-block;background:var(--acs);color:var(--ac);padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px}
.ttl{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.12;text-wrap:balance}
.ttl em{font-style:normal;color:var(--ac)}
.lede{margin:8px 0 0;color:var(--mu);font-size:15px;line-height:1.5;max-width:36ch}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;width:100%}
.h2{margin:8px 0 -6px;font-size:17px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px}
.h2 small{font-size:13px;color:var(--mu);font-weight:700;letter-spacing:0}

/* ---------- superfici: una sola famiglia di card (raggio 18, ombra leggera come su desktop) ---------- */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:0 1px 2px var(--sh),0 6px 18px var(--sh)}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px}
.focus{box-shadow:inset 4px 0 0 var(--ac),0 1px 2px var(--sh),0 6px 18px var(--sh)}
.ch{display:flex;align-items:flex-start;gap:10px;font-weight:800;font-size:16px;line-height:1.35;letter-spacing:-.01em}
.ch svg{color:var(--ac);flex:none;margin-top:2px}
.mu{color:var(--mu)}.p0{margin:0}.sm{font-size:13.5px}

/* ---------- pulsanti: una coppia sola (pieno teal / contorno) + secondario tenue ---------- */
.btn{min-height:48px;border-radius:14px;border:0;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;
  background:var(--sf2);color:var(--ink);transition:transform 150ms var(--eo),background-color 150ms ease,opacity 150ms ease;white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.pri{background:var(--ac);color:var(--onac)}
.btn.out{background:none;border:1px solid var(--ln2)}
.btn.s{min-height:44px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:8px}.row>*{flex:1}.row>.pri{flex:1.4}
@media (max-width:359px){.row{flex-direction:column-reverse}.row>*{flex:none;width:100%}}
.link{border:0;background:none;padding:0;min-height:44px;display:inline-flex;align-items:center;gap:6px;color:var(--ac);font-weight:700;font-size:14.5px;align-self:flex-start}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:none;color:var(--mu);display:grid;place-items:center;flex:none}
.ib:active{background:var(--sf2)}

/* ---------- selettori con indicatore che scorre (movimento 1.1: strato evidenziato ritagliato con clip-path) ---------- */
.sg{position:relative;border-radius:14px}
.sg .l{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:4px}
.sg button,.sg .l>span{min-height:40px;border:0;border-radius:10px;background:none;font-weight:700;font-size:13.5px;padding:0 6px;
  display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;line-height:1.2}
.sg .hi{position:absolute;inset:0;pointer-events:none;clip-path:inset(0 100% 0 0 round 10px)}
/* Studia: pillole chiare, quella attiva teal (st-key-studynav) */
.sg.study{background:var(--sf);border:1px solid var(--ln);box-shadow:0 1px 2px var(--sh)}
.sg.study button{color:var(--mu)}
.sg.study button,.sg.study .l>span{padding:0 2px}
@media (max-width:359px){.sg.study button,.sg.study .l>span{font-size:12.5px}}
.sg.study .hi .l>span{background:var(--acs);color:var(--ac)}
/* selettori nelle pagine (stButtonGroup): stesso disegno, fondo tenue */
.sg.pg{background:var(--sf2)}
.sg.pg button{color:var(--mu)}
.sg.pg .hi .l>span{background:var(--acs);color:var(--ac);box-shadow:inset 0 0 0 1px var(--acl)}
.sg.pg .hi .l>span svg{color:var(--ac)}

/* ---------- barra in basso: blu notte, voce attiva teal piena (come la barra desktop) ---------- */
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:7;background:var(--nav);border-top:1px solid var(--navln);
  padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.dev:not(.full) .tabs{padding-bottom:22px}
.tabs .sg{border-radius:16px}
.tabs .sg .l{padding:0;gap:4px}
.tabs .sg button,.tabs .sg .l>span{min-height:56px;flex-direction:column;gap:3px;font-size:11.5px;border-radius:14px;padding:0 2px}
.tabs .sg button{color:var(--navink)}
.tabs .sg .hi{clip-path:inset(0 100% 0 0 round 14px)}
.tabs .sg .hi .l>span{background:var(--navac);color:var(--navonac)}

/* ---------- numeri (ui.stats): tre card uguali in riga ---------- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{padding:12px 12px 13px;min-width:0}
.stat .lb{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .lb svg{color:var(--ac);flex:none}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--mu);font-weight:700;margin-left:2px;letter-spacing:0}
.stat .hn{font-size:12px;color:var(--mu);line-height:1.3;margin-top:1px}
.stat.acc .v{color:var(--ac)}

/* numeri che rotolano (views/motion.roll) */
.roll{display:inline-flex;font-variant-numeric:tabular-nums}
.dg{display:inline-block;height:1.15em;line-height:1.15em;overflow:hidden;vertical-align:bottom}
.dg i{display:block;font-style:normal;height:1.15em}

/* ---------- liste ---------- */
.list{overflow:hidden}
.li{position:relative;display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 16px;border-top:1px solid var(--ln);text-align:left;width:100%;
  background:var(--sf);border-left:0;border-right:0;border-bottom:0;touch-action:pan-y}
.list>.li:first-child,.list>.sw:first-child>.li{border-top:0}
button.li:active{background:var(--sf2)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:700;font-size:15px;line-height:1.3;transition:opacity 250ms ease}
.tx span{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.35}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--acs);color:var(--ac);flex:none}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sf2);color:var(--mu);white-space:nowrap}
.tag.w{background:var(--warns);color:var(--warn)}
.chev{color:var(--edge);flex:none}
/* righe con scorrimento: dietro c'e' l'azione rossa */
.sw{position:relative;background:var(--bad);border-top:1px solid var(--ln)}
.list>.sw:first-child{border-top:0}
.sw>.li{border-top:0;z-index:1;transition:transform 250ms var(--eo)}
.sw.drag>.li{transition:none}
.sw .del{position:absolute;right:0;top:0;bottom:0;width:96px;border:0;background:none;color:#fff;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.sw.gone{transition:opacity 200ms var(--ei)}

/* spunta (movimento 1.1): il segno si disegna, il testo si attenua e si barra */
.ck{width:28px;height:28px;border-radius:9px;border:2px solid var(--edge);display:grid;place-items:center;flex:none;background:none;padding:0;color:var(--onac);
  transition:background-color 150ms ease,border-color 150ms ease}
.ck svg polyline{stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset 250ms var(--eo) 80ms}
.ck.on{background:var(--ac);border-color:var(--ac)}
.ck.on svg polyline{stroke-dashoffset:0}
.ckw{width:44px;height:44px;margin:-8px -8px -8px -10px;display:grid;place-items:center;border:0;background:none;padding:0;flex:none}
.done .tx b{opacity:.6;text-decoration:line-through;text-decoration-color:var(--mu);text-decoration-thickness:1.5px}
.done .tx span{opacity:.6}

/* ---------- barra di avanzamento: si allunga con scaleX ---------- */
.prog{height:8px;border-radius:99px;background:var(--sf2);overflow:hidden}
.prog i{display:block;height:100%;width:100%;background:var(--ac);border-radius:99px;transform-origin:left;transition:transform 250ms var(--eio)}

/* ---------- stato vuoto (ui.empty_state) ---------- */
.empty{padding:28px 20px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.orb{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--acs);color:var(--ac);margin-bottom:8px}
.empty h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.empty p{margin:0;color:var(--mu);font-size:14.5px;max-width:32ch}
.empty .acts{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:14px}

/* ---------- Adesso: l'unica card con il gradiente (st-key-now) ---------- */
.now{border-radius:22px;padding:20px;color:#fff;background:linear-gradient(120deg,var(--ga),var(--gb));position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:8px;align-items:flex-start;box-shadow:0 14px 34px rgba(3,105,161,.22)}
.now::before,.now::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.now::before{right:-70px;top:-110px;width:240px;height:240px}
.now::after{right:110px;bottom:-110px;width:160px;height:160px;background:rgba(255,255,255,.05)}
.now>*{position:relative;z-index:1}
.now .k{display:inline-block;background:rgba(3,40,60,.32);padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.now .t{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.now p{margin:0;color:#fff;font-size:14.5px}
.now .trk{height:6px;border-radius:99px;background:rgba(255,255,255,.25);width:100%;overflow:hidden;margin-top:4px}
.now .trk i{display:block;height:100%;width:100%;background:#fff;border-radius:99px;transform-origin:left;transition:transform 250ms var(--eio)}
.now .btn{background:#fff;color:#0F766E;margin-top:6px}

/* ---------- agenda: striscia della settimana ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:6px;position:relative}
.wd{min-height:62px;border:0;background:none;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;z-index:1;color:var(--ink);transition:color 200ms ease}
.wd small{font-size:11.5px;font-weight:700;color:var(--mu);transition:color 200ms ease;text-transform:capitalize}
.wd b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.wd .dots{display:flex;gap:3px;height:5px}
.wd .dots i{width:5px;height:5px;border-radius:50%;background:var(--ac)}
.wd.today b{color:var(--ac)}
.wd[aria-pressed="true"]{color:var(--onac)}
.wd[aria-pressed="true"] small,.wd[aria-pressed="true"] b{color:var(--onac)}
.wd[aria-pressed="true"] .dots i{background:var(--onac)}
.wsel{position:absolute;z-index:0;top:6px;bottom:6px;left:6px;border-radius:14px;background:var(--ac);transition:transform 300ms var(--eio)}
.ev{display:flex;gap:12px;align-items:stretch;padding:12px 16px;border-top:1px solid var(--ln);min-height:60px}
.ev:first-child{border-top:0}
.ev .tm{width:46px;flex:none;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3;padding-top:1px}
.ev .tm small{display:block;color:var(--mu);font-weight:700}
.ev .tm.dt{text-align:center;font-size:19px;line-height:1.05}
.ev .tm.dt small{font-size:11.5px;text-transform:capitalize;margin-bottom:2px}
.ev .bar{width:3px;border-radius:3px;background:var(--s0);flex:none}
.ev.k-esame .bar,.ev.k-interrogazione .bar{background:var(--ac)}
.ev.k-compito .bar,.ev.k-scadenza .bar{background:var(--warn)}
.ev.k-lezione .bar{background:var(--edge)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;font-size:13px;color:var(--mu);padding:2px 0 4px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}

/* ---------- espansori e schede: il contenuto sale quando compare ---------- */
.ex{display:grid;grid-template-rows:0fr;transition:grid-template-rows 200ms var(--eio)}
.ex.open{grid-template-rows:1fr;transition-duration:250ms}
.ex>div{min-height:0;overflow:hidden}
.exb{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;border:0;background:none;padding:0;color:var(--mu);font-weight:700;font-size:14px}
.exb svg{transition:transform 250ms var(--eio)}
.exb[aria-expanded="true"] svg{transform:rotate(180deg)}
.rise{animation:srRise 250ms var(--eo) backwards}
@keyframes srRise{from{opacity:0;transform:translateY(6px)}}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;border:0;background:none;width:100%;padding:0;text-align:left;font-size:15px}
.tog i{width:48px;height:30px;border-radius:99px;background:var(--sf2);border:1px solid var(--ln2);position:relative;flex:none;transition:background-color 150ms ease}
.tog i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--mu);transition:transform 250ms var(--eio),background-color 150ms ease}
.tog[aria-checked="true"] i{background:var(--ac);border-color:var(--ac)}
.tog[aria-checked="true"] i::after{transform:translateX(18px);background:var(--onac)}

/* ---------- voti ---------- */
.grade{min-width:46px;height:36px;padding:0 8px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:15.5px;font-variant-numeric:tabular-nums;background:var(--acs);color:var(--ac);flex:none}
.grade.b{background:var(--warns);color:var(--warn)}
.big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.spark{width:100%;height:56px;display:block;overflow:visible}

/* ---------- caricamento ---------- */
.drop{border:1.5px dashed var(--ln2);border-radius:var(--r);background:var(--sf);display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 16px 18px;text-align:center;width:100%;
  transition:border-color 150ms ease,background-color 150ms ease}
.drop:active{border-color:var(--ac);background:var(--acs)}
.drop b{font-size:16px}
.fmt{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:2px 0 6px}
.fmt div{display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
.fmt div span{color:var(--mu);text-align:right}
.srch{display:flex;align-items:center;gap:8px;min-height:48px;border-radius:14px;background:var(--sf2);padding:0 14px;color:var(--mu)}
.srch input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;color:var(--ink);min-height:46px}

/* ---------- sagoma durante il caricamento ---------- */
.skel{display:grid;gap:10px}
.skel i{display:block;height:60px;border-radius:var(--r);background:var(--sf2);animation:srPulse 1.1s ease-in-out infinite}
.skel i.t{height:20px;width:45%;border-radius:8px}
@keyframes srPulse{50%{opacity:.55}}

/* ---------- quiz (movimento 1.1): sbagliata = scossa, giusta = conferma; spiegazione dopo; domanda nuova da destra ---------- */
.qn{display:flex;flex-direction:column;gap:12px}
.qq{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.35;margin:4px 0 4px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;width:100%;border:1.5px solid var(--ln);background:var(--sf);border-radius:14px;text-align:left;padding:10px 14px;font-size:15.5px;font-weight:600;
  transition:border-color 150ms ease,background-color 150ms ease,transform 150ms var(--eo)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt .lt{width:28px;height:28px;border-radius:8px;background:var(--sf2);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--mu);flex:none}
.opt.ok{border-color:var(--ok);background:var(--oks)}
.opt.ok .lt{background:var(--ok);color:#06240F}
.opt.ko{border-color:var(--bad);background:var(--bads)}
.opt.ko .lt{background:var(--bad);color:#fff}
.opt.ko.mine{animation:srShake 360ms var(--eo)}
.opt:disabled{cursor:default;color:var(--ink)}
@keyframes srShake{16%{transform:translateX(-10px)}33%{transform:translateX(10px)}50%{transform:translateX(-6px)}66%{transform:translateX(6px)}83%{transform:translateX(-3px)}}
.expl{border-radius:14px;background:var(--sf2);padding:12px 14px;font-size:14.5px;animation:srRise2 300ms var(--eo) 120ms backwards}
.expl b{display:block;margin-bottom:2px}
@keyframes srRise2{from{opacity:0;transform:translateY(8px)}}
.qin{animation:srQIn 200ms var(--eo)}
@keyframes srQIn{from{opacity:0;transform:translateX(8px)}}
.score{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:22px 8px 8px}
.score .ring{animation:srScore 260ms var(--eo) backwards}
.score h3{margin:6px 0 0;font-size:22px;font-weight:800;letter-spacing:-.02em;animation:srRise2 260ms var(--eo) 90ms backwards}
.score p{margin:0;color:var(--mu);animation:srRise2 260ms var(--eo) 130ms backwards}
@keyframes srScore{from{opacity:0;transform:scale(.94)}}

/* ---------- flashcard (movimento 1.1): gira in 3D, la faccia che si allontana si scurisce a meta' giro ---------- */
.flip{perspective:1600px;width:100%;border:0;background:none;padding:0;text-align:left}
.flip .fin{display:grid;transform-style:preserve-3d}
.flip .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;position:relative;min-height:210px;display:flex;flex-direction:column;justify-content:center;gap:8px;
  background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:20px;box-shadow:0 1px 2px var(--sh),0 6px 18px var(--sh)}
.flip .face .q{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.flip .face .h{font-size:13px;color:var(--mu);font-weight:600}
.flip .face.b{transform:rotateY(180deg);border-color:var(--acl);box-shadow:inset 4px 0 0 var(--ac),0 1px 2px var(--sh),0 6px 18px var(--sh)}
.flip .face.b .q{font-size:21px}
.flip.on .fin{transform:rotateY(180deg)}
.flip.anim .fin{animation:srFlip 360ms var(--eio)}
.flip.anim .face::after{content:"";position:absolute;inset:0;border-radius:inherit;background:#000;opacity:0;pointer-events:none;animation:srShade 360ms var(--eio)}
.flip.back.anim .fin{animation:srFlipB 360ms var(--eio)}
@keyframes srFlip{from{transform:rotateY(0deg)}}
@keyframes srFlipB{from{transform:rotateY(180deg)}}
@keyframes srShade{50%{opacity:.3}}
.fcw{position:relative}
.ghost{position:absolute;left:0;right:0;top:0;z-index:3;pointer-events:none}
.dots5{display:flex;gap:6px;justify-content:center}
.dots5 i{width:7px;height:7px;border-radius:50%;background:var(--ln2);transition:background-color 200ms ease}
.dots5 i.on{background:var(--ac)}

/* ---------- Pomodoro ---------- */
.pomo{display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 0 4px}
.pomo svg{width:220px;height:220px}
.pomo .trk{stroke:var(--sf2)}
.pomo .fill{stroke:var(--ac);stroke-linecap:round;stroke-dasharray:100;transition:stroke-dashoffset 1s linear}
.pomo .clock{font-size:46px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;fill:var(--ink)}

/* ---------- mappa ---------- */
.map{border-radius:14px;background:var(--sf2);overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.map .n rect:not(.hit){fill:var(--sf);stroke:var(--ln2);stroke-width:1.5;transition:stroke 150ms ease}
.map .n text{fill:var(--ink);font:700 12px Manrope,sans-serif}
.map .n.root rect{stroke:var(--ac);stroke-width:2}
.map .n.on rect{stroke:var(--ac);stroke-width:2.5;fill:var(--acs)}
.map .e{stroke:var(--ln2);stroke-width:1.5;fill:none}
.map .n{cursor:pointer}

/* ---------- fogli dal basso (le finestre della versione desktop) ---------- */
.layer{position:absolute;inset:0;z-index:20;pointer-events:none}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity 200ms var(--ei)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--sf);border-radius:26px 26px 0 0;
  transform:translateY(100%);transition:transform 200ms var(--ei);box-shadow:0 -10px 40px var(--sh);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.tall{height:92%}
.layer.open{pointer-events:auto}
.layer.open .scrim{opacity:1;transition:opacity 280ms var(--eo)}
.layer.open .sheet{transform:translateY(0);transition:transform 280ms var(--eo)}
.grab{padding:10px 0 4px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab i{width:40px;height:5px;border-radius:99px;background:var(--ln2)}
.shh{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:4px;padding:0 8px 8px;touch-action:none}
.shh h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shb{overflow-y:auto;padding:4px 20px 24px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain;flex:1}
.shf{padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);background:var(--sf)}
.dev:not(.full) .shf{padding-bottom:26px}
/* pagine dentro un foglio (Impostazioni): spinta laterale */
.stack{position:relative;flex:1;overflow:hidden;display:grid}
.stack>.pg{position:relative;grid-area:1/1;overflow-y:auto;padding:4px 20px 24px;display:flex;flex-direction:column;gap:16px;background:var(--sf)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.fld .lb{font-size:13px;font-weight:700;color:var(--mu)}
.in{min-height:48px;border-radius:12px;border:1px solid var(--edge);background:var(--bg);padding:0 14px;font-size:16px;width:100%;color:var(--ink);outline:none;transition:border-color 150ms ease,box-shadow 150ms ease}
.in:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.in.bad{border-color:var(--bad)}
textarea.in{padding:12px 14px;min-height:84px;resize:none}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);
  background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hint{font-size:12.5px;color:var(--mu);margin:0}
.err{font-size:13px;color:var(--bad);margin:0;font-weight:700}
.ok-t{font-size:13px;color:var(--ac);margin:0;font-weight:700}
input[type=range]{width:100%;accent-color:var(--ac);min-height:44px;margin:0}
.rv{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:800}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{min-width:48px;min-height:44px;border-radius:999px;border:1px solid var(--ln2);background:none;font-weight:700;font-size:14px;color:var(--mu);padding:0 12px;
  transition:background-color 150ms ease,border-color 150ms ease,color 150ms ease,transform 150ms var(--eo)}
.pills button:active{transform:scale(.97)}
.pills button[aria-pressed="true"]{background:var(--acs);border-color:var(--acl);color:var(--ac)}
.opts>button{display:flex;align-items:center;gap:12px;min-height:56px;width:100%;border:0;background:none;text-align:left;padding:4px 0;font-size:15.5px;font-weight:600;border-top:1px solid var(--ln)}
.opts>button:first-child{border-top:0}
.opts .r{margin-left:auto;color:var(--ac)}
.opts .chev{margin-left:auto}
.step{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px;align-items:center}
.step .btn{padding:0;min-height:48px}
.step .in{text-align:center;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}

/* riga compatta (richiesta del voto) */
.vrow{display:flex;align-items:center;gap:12px;padding:10px 6px 10px 14px}
.vrow .btn{flex:none}
/* righe toccabili */
.li.tap{cursor:pointer}
.li.tap:active{background:var(--sf2)}
/* schema della mappa */
.schema{display:flex;flex-direction:column}
.sn{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:52px;border:0;border-top:1px solid var(--ln);background:none;text-align:left;padding:14px 0 12px 22px;position:relative}
.sn:first-child{border-top:0}
.sn.root{padding-left:0}
.sn .sd{width:10px;height:10px;border-radius:50%;border:2px solid var(--ac);flex:none;margin-top:5px}
.sn.root .sd{background:var(--ac)}
.sn:not(.root)::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;background:var(--ln)}
.sn .tx span{white-space:normal}
.sn>svg{color:var(--edge);flex:none;margin-top:3px;transition:transform 250ms var(--eio)}
.sn[aria-expanded="true"]>svg{transform:rotate(180deg)}
/* mappa con zoom */
.map{position:relative;touch-action:none;cursor:grab}
.map #mg{transform-origin:0 0;transition:transform 250ms var(--eio)}
.map.pan #mg{transition:none}
.zm{position:absolute;right:6px;bottom:6px;display:flex;gap:2px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:2px}
/* sessione in corso: barra fissa sopra la navigazione */
.mini{position:absolute;left:8px;right:8px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:4px;
  background:var(--sf);border:1px solid var(--acl);border-radius:16px;padding:4px 4px 4px 6px;box-shadow:0 10px 30px var(--sh)}
.dev:not(.full) .mini{bottom:98px}
.mini .open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;min-height:48px;padding:0 6px}
.mini .open svg{flex:none}
.mini .tx b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .tm{font-weight:800;font-variant-numeric:tabular-nums;color:var(--ac);font-size:15px}
.app.has-mini .scr{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.app.has-mini .toast{bottom:calc(152px + env(safe-area-inset-bottom,0px))}
.dev:not(.full) .app.has-mini .toast{bottom:166px}
.fhint{text-align:center;margin-top:-6px}
.flip.drag .fin{transition:none}

/* ---------- avviso con Annulla ---------- */
.toast{position:absolute;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;
  padding:6px 6px 6px 16px;min-height:52px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;box-shadow:0 10px 30px var(--sh);
  opacity:0;transform:translateY(16px);transition:opacity 170ms var(--ei),transform 170ms var(--ei);pointer-events:none}
.dev:not(.full) .toast{bottom:104px}
.toast.on{opacity:1;transform:none;transition-duration:240ms;transition-timing-function:var(--eo);pointer-events:auto}
.toast span{flex:1}
.toast button{border:0;background:none;font-weight:800;min-height:40px;padding:0 12px;border-radius:10px}
.th-d .toast button{color:#0F766E}.th-l .toast button{color:#5EEAD4}

/* animazioni spente: «Nessuna», o «Automatiche» con il sistema che le chiede ridotte. Restano gli indicatori di lavoro. */
.still *:not(.spin):not(.skel i),.still *::before,.still *::after{animation:none!important;transition:none!important}

}

const EO='cubic-bezier(.32,.72,0,1)',EI='cubic-bezier(.55,0,1,.45)',EIO='cubic-bezier(.77,0,.175,1)';
const sysReduce=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const still=()=>S.motion==='nessuna'||(S.motion==='auto'&&sysReduce());
const D=ms=>still()?0:ms;
const anim=(el,k,o)=>{if(!el||!el.animate)return{finished:Promise.resolve()};o.duration=D(o.duration);return el.animate(k,o)};

/* selettori: strato evidenziato con le stesse voci nei colori attivi, ritagliato sulla voce attiva */
function sg(key,items,cur,cls,act,label){
  const btn=(it,i)=>`<button data-a="${act}:${i}" ${key==='tabs'?(i===cur?'aria-current="page"':''):`aria-pressed="${i===cur}"`}>${it[2]?ic(it[2],key==='tabs'?22:16):''}<span>${it[1]}</span></button>`;
  const sp=it=>`<span>${it[2]?ic(it[2],key==='tabs'?22:16):''}<span>${it[1]}</span></span>`;
  return `<div class="sg ${cls}" data-sg="${key}" data-cur="${cur}"><div class="l" role="${key==='tabs'?'navigation':'group'}" aria-label="${label||''}">${items.map(btn).join('')}</div><div class="hi" aria-hidden="true"><div class="l">${items.map(sp).join('')}</div></div></div>`;
}
function placeSg(el,animate){
  if(!el)return;const cur=+el.dataset.cur,b=el.querySelector('.l').children[cur],hi=el.querySelector('.hi');if(!b)return;
  const W=el.clientWidth,H=el.clientHeight,r=parseFloat(getComputedStyle(hi.querySelector('.l>span')).borderRadius)||10;
  const v=`inset(${b.offsetTop}px ${W-b.offsetLeft-b.offsetWidth}px ${H-b.offsetTop-b.offsetHeight}px ${b.offsetLeft}px round ${r}px)`;
  if(!animate||still()||!hi.style.clipPath){hi.style.transition='none';hi.style.clipPath=v;void hi.offsetWidth;hi.style.transition=''}
  else{hi.style.transition=`clip-path 320ms ${EIO}`;hi.style.clipPath=v}
}
function setSg(key,i,animate=true){
  const el=$(`[data-sg="${key}"]`);if(!el)return;el.dataset.cur=i;
  [...el.querySelector('.l').children].forEach((b,j)=>{if(key==='tabs'){j===i?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')}else b.setAttribute('aria-pressed',j===i)});
  placeSg(el,animate);
}
const placeAll=()=>$$('[data-sg]').forEach(el=>placeSg(el,false));

/* numeri che rotolano: solo le cifre cambiate, verso l'alto se il numero cresce */
function rollTo(el,txt){
  if(!el)return;const old=el.dataset.v??el.textContent;el.dataset.v=txt;
  if(old===txt)return;
  if(still()||old.length!==txt.length){el.textContent=txt;return}
  const num=s=>parseFloat(String(s).replace(',','.').replace(/[^\d.]/g,''))||0, up=num(txt)>=num(old);
  el.setAttribute('aria-label',txt);el.textContent='';
  [...txt].forEach((ch,i)=>{
    const o=old[i];
    if(/\d/.test(ch)&&/\d/.test(o)&&o!==ch){
      const w=document.createElement('span');w.className='dg';w.setAttribute('aria-hidden','true');
      const c=document.createElement('span');c.style.display='block';c.innerHTML=up?`<i>${o}</i><i>${ch}</i>`:`<i>${ch}</i><i>${o}</i>`;w.appendChild(c);el.appendChild(w);
      c.animate([{transform:`translateY(${up?0:-1.15}em)`},{transform:`translateY(${up?-1.15:0}em)`}],{duration:350,easing:EIO,fill:'forwards'});
    }else{const s=document.createElement('span');s.setAttribute('aria-hidden','true');s.textContent=ch;el.appendChild(s)}
  });
  setTimeout(()=>{if(el.dataset.v===txt){el.textContent=txt;el.removeAttribute('aria-label')}},400);
}
/* barra: si allunga da dov'era */
function progTo(i,frac){if(!i)return;i.style.transform=`scaleX(${Math.max(0,Math.min(1,frac))})`}

/* avviso: con Annulla resta 5 s */
let tT;
function toast(msg,undo){
  const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-a="undo">Annulla</button>':''}`;t._undo=undo||null;
  t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),undo?5200:2600);
}
</script>

<script>
/* ================= pezzi (ui.py) ================= */
const hero=(eye,t,lede,right='')=>`<div class="hero">${eye?`<span class="eye">${eye}</span>`:''}<div class="hrow"><h1 class="ttl">${t}</h1>${right}</div>${lede?`<p class="lede">${lede}</p>`:''}</div>`;
const stat=(icn,lb,v,small,hn,key,cls='')=>`<div class="card stat ${cls}"><div class="lb">${ic(icn,13,2.4)}${lb}</div><div class="v"><span class="roll" data-roll="${key}" data-v="${v}">${v}</span>${small?`<small>${small}</small>`:''}</div><div class="hn">${hn}</div></div>`;
const empty=(icn,t,p,acts='')=>`<div class="card empty"><div class="orb">${ic(icn,26)}</div><h3>${t}</h3><p>${p}</p>${acts?`<div class="acts">${acts}</div>`:''}</div>`;
const exp=(key,label,body)=>`<div><button class="exb" data-a="tg:${key}" aria-expanded="${!!S[key]}">${label}${ic('down',18)}</button><div class="ex ${S[key]?'open':''}" data-ex="${key}"><div ${S[key]?'':'inert'}>${body}</div></div></div>`;
const tog=(key,label)=>`<button class="tog" role="switch" aria-checked="${!!S[key]}" data-a="sw:${key}"><span>${label}</span><i></i></button>`;
const pri=(a,icn,t,x='')=>`<button class="btn pri ${x}" data-a="${a}">${icn?ic(icn,18):''}${t}</button>`;
const out=(a,icn,t,x='')=>`<button class="btn out ${x}" data-a="${a}">${icn?ic(icn,18):''}${t}</button>`;
const sessRow=s=>`<div class="li ${s.done?'done':''}" data-sess="${s.id}"><button class="ckw" data-a="done:${s.id}" aria-pressed="${s.done}" aria-label="Fatta: ${esc(s.t)}"><span class="ck ${s.done?'on':''}">${CK}</span></button><div class="tx"><b>${esc(s.t)}</b><span>Studio · ${s.m} minuti</span></div></div>`;
const lessonRow=l=>`<div class="ev k-lezione"><div class="tm">${l.s}<small>${l.e}</small></div><div class="bar"></div><div class="tx"><b>Lezione di ${esc(l.m||S.subject)}</b><span>${esc(l.aula)} · ${esc(l.doc)}</span></div></div>`;
const WD=['lun','mar','mer','gio','ven','sab','dom'],WDF=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const dOf=i=>{const d=new Date(MON);d.setDate(MON.getDate()+i);const k=((i%7)+7)%7;return {w:WD[k],W:WDF[k],n:d.getDate(),m:MESI[d.getMonth()]}};
const when=d=>{const x=dOf(d),k=d-T;return `${x.w} ${x.n} ${x.m}`+(k===0?' · oggi':k===1?' · domani':k>1?` · tra ${k} giorni`:'')};
const eventRow=(e,list)=>{const dn=dOf(e.d);return `<div class="ev k-${e.k}">${list?`<div class="tm dt"><small>${dn.w}</small>${dn.n}</div>`:`<div class="tm">${e.s||''}<small>${e.s?'':'in giornata'}</small></div>`}<div class="bar"></div><div class="tx"><b>${esc(e.t)}</b><span>${KIND[e.k]} · ${esc(e.m||S.subject)}${list&&e.s?' · '+e.s:''}</span></div></div>`};
const swRow=(id,kind,inner,label)=>`<div class="sw" data-sw="${kind}:${id}"><div class="li tap" role="button" tabindex="0" data-a="sheet:${kind}:${id}" aria-label="${esc(label||'')}">${inner}${ic('right',18).replace('<svg','<svg class="chev"')}</div><button class="del" data-a="del:${kind}:${id}" tabindex="-1">${ic('trash',18)}Elimina</button></div>`;
const hasDocs=()=>S.docs.length>0;
const nextExam=()=>S.events.filter(e=>e.k==='esame'&&!e.past&&e.m===S.subject).sort((a,b)=>a.d-b.d)[0];

/* ================= schermate ================= */
const V={};
V.oggi=()=>{
  const f=S.data==='dati',past=S.events.find(e=>e.past);
  let h=hero(`${dOf(T).W} ${dOf(T).n} ${dOf(T).m}`,`${greet()}, <em>${esc(S.name)}</em>.`);
  h+=nowCard();
  if(S.vote&&past)h+=`<div class="card vrow" data-blk="vote"><div class="tx"><b>Che voto hai preso?</b><span>${KIND[past.k]} · ${dOf(past.d).w} ${dOf(past.d).n} ${dOf(past.d).m}</span></div><button class="btn out s" data-a="sheet:voto:ev">Registra</button><button class="ib" data-a="vote-no" aria-label="Non ancora, chiedimelo domani">${ic('x',18)}</button></div>`;
  if(f)h+=`<div class="stats two">${stat('copy','Da ripassare',String(S.cards.length-S.fcI),'','flashcard in scadenza','due')}${stat('flame','Ultimi 7 giorni','3 h 20','','4 giorni di fila','week')}</div>`;
  h+=`<h2 class="h2">Oggi</h2>`;
  const ls=S.lessons.filter(l=>l.d===T).sort((a,b)=>a.s.localeCompare(b.s));
  h+=f?`<div class="card list">${ls.map(lessonRow).join('')}${sel().map(sessRow).join('')}</div>`
      :`<div class="card list"><button class="li" data-a="nav:agenda"><div class="ico">${ic('cal')}</div><div class="tx"><b>Niente in agenda oggi</b><span>Aggiungi lezioni e verifiche in Agenda</span></div>${ic('right',18)}</button></div>`;
  const up=S.events.filter(e=>!e.past).sort((a,b)=>a.d-b.d).slice(0,4);
  h+=`<h2 class="h2">Prossimi impegni</h2>`+(up.length?`<div class="card list">${up.map(e=>`<button class="li" data-a="goday:${e.d}"><div class="ico">${ic(e.k==='esame'?'target':'pen')}</div><div class="tx"><b>${esc(e.t)}</b><span>${when(e.d)}</span></div>${ic('right',18)}</button>`).join('')}</div>`
    :`<div class="card pad"><p class="p0 mu">Nessuna verifica nelle prossime tre settimane.</p><button class="link" data-a="sheet:evento">${ic('plus',16)}Aggiungi una verifica</button></div>`);
  return h;
};
function nowCard(){
  if(!S.sessions.length)return `<div class="now" data-blk="now"><span class="k">Inizia da qui</span><span class="t">Crea il tuo piano di studio</span><p>Dalla data della verifica StudyRAG divide appunti e libri in sessioni, con i ripassi.</p><button class="btn s" data-a="nav:studia">${ic('plus',16)}Crea un piano</button></div>`;
  const todo=sel().filter(s=>!s.done),n=sel().length,d=doneToday();
  if(!todo.length)return `<div class="now" data-blk="now"><span class="k">Oggi · ${esc(S.subject)}</span><span class="t">Sessioni di oggi finite</span><p>Domani: ${esc(S.sessions.find(s=>s.d===T+1)?.t||'riposo')}.</p><div class="trk"><i style="transform:scaleX(1)"></i></div><button class="btn s" data-a="tab:studia">${ic('plan',16)}Vedi il piano</button></div>`;
  const s=todo[0];
  return `<div class="now" data-blk="now"><span class="k">Adesso · ${esc(S.subject)}</span><span class="t">${esc(s.t)}</span><p>${s.m} minuti · sessione ${d+1} di ${n}</p><div class="trk"><i style="transform:scaleX(${d/n})"></i></div><button class="btn s" data-a="sheet:pomo:${s.id}">${ic('play',16)}Inizia</button></div>`;
}
const study=()=>`<div class="subw" data-blk="sub">${sg('study',STUDY.map(s=>[s[0],s[1]]),STUDY.findIndex(x=>x[0]===S.study),'study','st','Studia')}</div>`;
V.piano=()=>{
  if(!hasDocs()&&!S.books.length)return hero(esc(S.subject),'Il tuo <em>piano</em>','Sessioni dalla data della verifica a oggi, con i ripassi.')+
    empty('plan','Niente da pianificare',"Aggiungi un libro in Biblioteca o carica appunti nell'Archivio.",pri('sheet:libro','plus','Aggiungi un libro','full')+out('upload','upload','Carica appunti','full'));
  const n=S.sessions.filter(s=>s.done).length,t=S.sessions.length,ex=nextExam();
  let h=hero(esc(S.subject),`Piano`,'',`<button class="btn out s" data-a="sheet:piano">${ic('gear',16)}Imposta</button>`);
  h+=`<div class="card pad focus"><div class="ch">${ic('target')}<span>${ex?esc(ex.t):'Studio libero'}<span class="mu" style="display:block;font-weight:600;font-size:13.5px;margin-top:2px">${ex?when(ex.d):'Nessuna verifica in programma'}</span></span></div>
    <div class="prog"><i data-prog="plan" style="transform:scaleX(${t?n/t:0})"></i></div><p class="p0 mu sm"><b class="roll" data-roll="pdone" data-v="${n}" style="color:var(--ink)">${n}</b> di ${t} sessioni fatte</p></div>`;
  [[T,`Oggi · ${dOf(T).w} ${dOf(T).n}`],[T+1,`Domani · ${dOf(T+1).w} ${dOf(T+1).n}`],[T+2,`${dOf(T+2).W} ${dOf(T+2).n}`]].forEach(([d,l])=>{const ss=S.sessions.filter(s=>s.d===d);if(ss.length)h+=`<h2 class="h2">${l}<small>${ss.reduce((a,s)=>a+s.m,0)} min</small></h2><div class="card list">${ss.map(sessRow).join('')}</div>`});
  return h;
};
V.quiz=()=>{
  if(!hasDocs())return hero(esc(S.subject),'<em>Quiz</em> e flashcard','Domande e carte create dai tuoi documenti.')+
    empty('quiz','Nessun documento',"Carica del materiale nell'Archivio: da lì nascono quiz e flashcard.",pri('upload','upload','Carica materiale','full'))+
    `<button class="link" data-a="sheet:condividi">${ic('download',16)}Importa i quiz di un compagno</button>`;
  return hero(esc(S.subject),'Quiz','',`<button class="ib" data-a="sheet:condividi" aria-label="Condividi o importa">${ic('share')}</button>`)+
    sg('qt',[[0,'Genera','spark'],[1,'Quiz','quiz'],[2,'Flashcard','copy']],S.quizTab,'pg','qt','Sezione dei quiz')+`<div id="qbody" style="display:flex;flex-direction:column;gap:16px">${qBody()}</div>`;
};
function qBody(){
  if(S.quizTab===0)return `<div class="card pad"><div class="fld"><label for="g-doc">Documento</label><select id="g-doc" class="in">${S.docs.map(d=>`<option ${S.genDoc==d.id?'selected':''}>${esc(d.n)}</option>`).join('')}</select></div>
     <div class="fld"><span class="lb">Tipo</span>${sg('gk',[[0,'Quiz'],[1,'Flashcard']],S.genKind,'pg','gk','Tipo')}</div>
     <div class="fld"><label for="g-n">${S.genKind?'Numero di flashcard':'Numero di domande'}: <span class="rv" id="g-nv">${S.genN}</span></label><input id="g-n" type="range" min="${S.genKind?5:3}" max="${S.genKind?40:20}" value="${S.genN}" data-in="genN"></div>
     <p class="hint">L'AI legge un campione distribuito su tutto il documento: genera più set per coprirlo meglio.</p>
     <button class="btn pri full" data-a="gen">${ic('spark',18)}Genera</button></div>`;
  if(S.quizTab===1)return `<div class="card list" id="qlist">${S.quizzes.map(q=>`<button class="li" data-a="sheet:run:${q.id}"><div class="ico">${ic('quiz')}</div><div class="tx"><b>${esc(q.t)}</b><span>${q.n} domande${q.last?' · ultimo risultato '+q.last:''}</span></div>${ic('play',18)}</button>`).join('')||'<div class="li"><div class="tx"><span>Ancora nessun quiz: generane uno.</span></div></div>'}</div>
    <div class="card pad"><div class="ch">${ic('timer')}<span>Simulazione di verifica</span></div><p class="p0 mu sm">Domande da tutti i documenti della materia, a tempo, come in classe. Alla fine vedi il voto stimato.</p>${out('sheet:run:sim','play','Inizia la simulazione','full')}</div>`;
  const i=S.fcI,c=S.cards[i];
  if(!c)return empty('check','Ripasso finito',`Sapevi ${S.fcKnown} carte su ${S.cards.length}. Quelle che sapevi tornano tra qualche giorno, le altre domani.`,out('fc-reset','','Ripassa di nuovo','full'));

      <div class="face f"><span class="h">Carta ${i+1} di ${S.cards.length}</span><span class="q">${esc(c[0])}</span><span class="h">Tocca per vedere la risposta</span></div>

    <p class="hint fhint">Dopo averla girata puoi trascinarla: a destra se la sapevi, a sinistra se no.</p><div class="row"><button class="btn out" data-a="fc-ans:0" ${S.fcFlip?'':'disabled'}>Non la sapevo</button><button class="btn pri" data-a="fc-ans:1" ${S.fcFlip?'':'disabled'}>La sapevo</button></div>`;
}
const Z={s:1,x:0,y:0};

  if(!hasDocs())return hero(esc(S.subject),'Le tue <em>mappe</em>','Concetti e collegamenti dei tuoi documenti, da esplorare.')+
    empty('net','Nessun documento',"Carica del materiale nell'Archivio per creare la prima mappa.",pri('upload','upload','Carica materiale','full'));
  return hero(esc(S.subject),'Mappe','',`<button class="btn out s" data-a="newmap">${ic('plus',16)}Nuova</button>`)+
   `<div class="card pad"><div class="ch">${ic('net')}<span>${esc(MPT)}<span class="mu" style="display:block;font-weight:600;font-size:13.5px;margin-top:2px">${MAP.n.length} concetti · da ${Math.min(S.docs.length,2)} document${Math.min(S.docs.length,2)===1?'o':'i'}</span></span></div>
    ${sg('mv',[[0,'Schema','list'],[1,'Mappa','net']],S.mapView,'pg','mv','Vista della mappa')}<div id="mbody" style="display:flex;flex-direction:column;gap:12px">${mBody()}</div></div>`;
};
function mBody(){
  if(S.mapView===0)return `<div class="schema">${MAP.n.map((n,i)=>`<button class="sn ${i?'':'root'}" data-a="node:${i}" aria-expanded="${S.mapSel===i}"><span class="sd"></span><span class="tx"><b>${esc(n[0])}</b>${S.mapSel===i?`<span class="rise">${esc(MAP.d[i])}</span>`:''}</span>${ic('down',16)}</button>`).join('')}</div>`;
  const W=340;
  return `<div class="map" id="map"><svg viewBox="0 0 ${W} 212" role="group" aria-label="Mappa dei concetti"><g id="mg" style="transform:translate(${Z.x}px,${Z.y}px) scale(${Z.s})">${MAP.e.map(([a,b])=>`<path class="e" d="M${MAP.n[a][1]} ${MAP.n[a][2]+14} C${MAP.n[a][1]} ${(MAP.n[a][2]+MAP.n[b][2])/2+10}, ${MAP.n[b][1]} ${(MAP.n[a][2]+MAP.n[b][2])/2-10}, ${MAP.n[b][1]} ${MAP.n[b][2]-14}"/>`).join('')}
     ${MAP.n.map((n,i)=>{const w=n[0].length*7.2+22;return `<g class="n ${n[3]?'root':''} ${S.mapSel===i?'on':''}" data-a="node:${i}" role="button" tabindex="0" aria-label="${esc(n[0])}"><rect x="${n[1]-w/2}" y="${n[2]-17}" width="${w}" height="34" rx="11"/><rect class="hit" x="${n[1]-w/2}" y="${n[2]-22}" width="${w}" height="44" fill="transparent" stroke="none"/><text x="${n[1]}" y="${n[2]+4}" text-anchor="middle">${esc(n[0])}</text></g>`}).join('')}</g></svg>
    <div class="zm"><button class="ib" data-a="zoom:1" aria-label="Ingrandisci">${ic('plus',18)}</button><button class="ib" data-a="zoom:-1" aria-label="Riduci"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button><button class="ib" data-a="zoom:0" aria-label="Rimetti al centro">${ic('target',18)}</button></div></div>
    <div id="mapinfo">${mapInfo()}</div><p class="hint">Trascina per spostarti, usa + e − per ingrandire.</p>`;

V.biblioteca=()=>{
  if(!S.books.length)return hero(esc(S.subject),'La tua <em>biblioteca</em>','I libri da studiare, con il segno di dove sei arrivato.')+
    empty('book','Nessun libro','Titolo e pagine bastano: il piano li divide in sessioni.',pri('sheet:libro','plus','Aggiungi un libro','full'));
  return hero(esc(S.subject),'Biblioteca','',`<button class="btn out s" data-a="sheet:libro">${ic('plus',16)}Aggiungi</button>`)+S.books.map(b=>`<div class="card pad" data-book="${b.id}">
    <div style="display:flex;gap:14px;align-items:flex-start"><div class="ico" style="width:48px;height:62px;border-radius:8px">${ic('book',22)}</div><div class="tx"><b style="font-size:16px">${esc(b.t)}</b><span>${esc(b.a)} · ${esc(S.subject)}</span></div></div>
    <div class="prog"><i data-prog="book${b.id}" style="transform:scaleX(${b.at/b.tot})"></i></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><p class="p0 mu sm">Pagina <b class="roll" data-roll="bk${b.id}" data-v="${b.at}" style="color:var(--ink)">${b.at}</b> di ${b.tot}</p>${out('sheet:segnalibro:'+b.id,'bookmark','Segnalibro','s')}</div></div>`).join('');
};
V.agenda=()=>{
  let h=hero(esc(S.subject),'Agenda','',out('sheet:aggiungi','plus','Aggiungi','s'))+sg('ag',[[0,'Settimana'],[1,'Eventi'],[2,'Orario']],S.agTab,'pg','ag','Vista agenda');
  return h+`<div id="agbody" style="display:flex;flex-direction:column;gap:16px">${agBody()}</div>`;
};
function dayItems(d){return S.lessons.filter(l=>l.d===((d%7)+7)%7).sort((a,b)=>a.s.localeCompare(b.s)).map(lessonRow).concat(S.events.filter(e=>e.d===d).map(e=>eventRow(e)))}
function weekLabel(){const a=dOf(7*S.week),b=dOf(7*S.week+6);return a.m===b.m?`${a.n} – ${b.n} ${b.m}`:`${a.n} ${a.m.slice(0,3)} – ${b.n} ${b.m.slice(0,3)}`}
function dayList(){const items=dayItems(S.day),x=dOf(S.day);

    l:items.length?`<div class="card list">${items.join('')}</div>`:`<div class="card pad"><p class="p0 mu">Niente in agenda.</p><button class="link" data-a="sheet:evento">${ic('plus',16)}Aggiungi un evento</button></div>`}}
function agBody(){

      ${S.week!==0?`<button class="link" data-a="wk:0" style="align-self:center;margin:-8px 0">Torna a oggi</button>`:''}

      ${exp('legend','Legenda dei colori',`<div class="legend"><span><i style="background:var(--ac)"></i>Verifiche e interrogazioni</span><span><i style="background:var(--warn)"></i>Compiti e scadenze</span><span><i style="background:var(--edge)"></i>Lezioni</span><span><i style="background:var(--s0)"></i>Altro</span></div>`)}`;
  }
  if(S.agTab===1){
    const up=S.events.filter(e=>!e.past).sort((a,b)=>a.d-b.d),ps=S.events.filter(e=>e.past);

      (ps.length?exp('past',`Passati (${ps.length})`,`<div class="card list">${ps.map(e=>eventRow(e,1)).join('')}</div>`):'');
  }
  if(!S.lessons.length)return empty('clock','Orario vuoto','Aggiungi le lezioni della settimana: compaiono in Oggi e il piano le evita.',pri('sheet:lezione','plus','Aggiungi una lezione','full'));
  return WDF.slice(0,6).map((n,d)=>{const l=S.lessons.filter(x=>x.d===d);return l.length?`<h2 class="h2">${n}</h2><div class="card list">${l.slice().sort((a,b)=>a.s.localeCompare(b.s)).map(lessonRow).join('')}</div>`:''}).join('')+`<button class="link" data-a="sheet:lezione">${ic('plus',16)}Aggiungi una lezione</button>`;
}
function placeWeek(animate){
  const w=$('#week'),s=$('#wsel');if(!w||!s)return;const k=S.day-7*S.week,b=w.children[k+1];
  if(!b||k<0||k>6){s.style.opacity=0;return}s.style.opacity=1;
  s.style.width=b.offsetWidth+'px';
  if(!animate||still())s.style.transition='none';else s.style.transition='';
  s.style.transform=`translateX(${b.offsetLeft-6}px)`;void s.offsetWidth;
}
const FORMATS=[['Documenti','PDF · DOCX · PPTX'],['Web e testo','HTML · MD · TXT'],['Tabelle','XLSX · CSV'],['Immagini','PNG · JPG · WEBP · GIF · BMP · TIFF']];
V.archivio=()=>{

const docRows=()=>{const q=S.q.toLowerCase(),ds=S.docs.filter(d=>d.n.toLowerCase().includes(q));
  return ds.length?ds.map(d=>swRow(d.id,'doc',`<div class="ico">${d.busy?'<span class="spin" style="width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite"></span>':ic(d.k==='img'?'img':'file')}</div><div class="tx"><b>${esc(d.n)}</b><span>${esc(d.m)}</span></div>`,d.n)).join('')
  :`<div class="li"><div class="tx"><span>Nessun documento con «${esc(S.q)}».</span></div></div>`};
V.voti=()=>{
  let h=hero(esc(S.subject),'Voti','',out('sheet:voto','plus','Nuovo voto','s'));
  if(!S.grades.length)return h+empty('voti','Nessun voto','Registra i voti per vedere la media e l\'andamento della materia.',pri('sheet:voto','star','Registra un voto','full'));
  h+=sg('vp',[[0,'1° quadr.'],[1,'2° quadr.'],[2,'Anno']],S.vperiod,'pg','vp','Periodo');
  return h+`<div id="vbody" style="display:flex;flex-direction:column;gap:16px">${vBody()}</div>`;
};
function vBody(){
  const gs=S.vperiod===1?[]:S.grades;
  if(!gs.length)return `<div class="card pad"><p class="p0 mu">Nessun voto nel 2° quadrimestre.</p></div>`;
  const a=avg();
  return `<div class="card pad"><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px"><div><div class="mu sm" style="font-weight:700">Media di ${esc(S.subject)}</div>
      <div class="big"><span class="roll" data-roll="avg" data-v="${fmt(a)}" style="color:${a>=6?'var(--ac)':'var(--warn)'}">${fmt(a)}</span></div></div>
      <span class="tag" id="gcount">${gs.length} ${gs.length===1?'voto':'voti'}</span></div>${spark()}</div>
    <div class="card list" id="glist">${gs.slice().reverse().map(g=>swRow(g.id,'grade',`<span class="grade ${g.n<6?'b':''}">${esc(g.v)}</span><div class="tx"><b>${g.t}</b><span>${g.d} · peso ${g.w===1?'normale':g.w<1?'metà':'doppio'}</span></div>`,'Voto '+g.v+', '+g.t)).join('')}</div>
    `;
}
function spark(){
  const g=S.grades,W=300,H=56;if(g.length<2)return '';
  const x=i=>8+i*(W-16)/(g.length-1),y=v=>H-6-(v-4)/6*(H-12);
  const d=g.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p.n).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-label="Andamento dei voti"><line x1="0" x2="${W}" y1="${y(6)}" y2="${y(6)}" stroke="var(--ln2)" stroke-dasharray="3 4"/><path d="${d}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${g.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.n)}" r="4" fill="var(--sf)" stroke="var(--ac)" stroke-width="2"/>`).join('')}</svg>`;
}
</script>

  $('#qe').innerHTML=`<div class="expl"><b>${k===q.a?'Giusto.':'Non è questa.'}</b>${esc(q.e)}</div>`;
  $('#qf').innerHTML=qFoot();progTo($('#qprog'),(Q.i+1)/QUIZ.length);
}
function qNext(){
  Q.i++;Q.pick=null;const r=$('#qr');
  anim(r.firstElementChild,[{opacity:1,transform:'none'},{opacity:0,transform:'translateX(-8px)'}],{duration:140,easing:EI,fill:'forwards'}).finished.then(()=>{
    r.innerHTML=qHTML(Q.i<QUIZ.length?'qin':'');$('#qf').innerHTML=qFoot();$('.shb').scrollTop=0;
    if(Q.i>=QUIZ.length){const qz=Q.qz;if(qz&&!Q.sim){qz.last=`${Q.right}/${QUIZ.length}`;if(S.tab==='studia'&&S.study==='quiz'&&S.quizTab===1&&$('#qbody'))$('#qbody').innerHTML=qBody()}}
  });
}
</script>

<script>
/* ================= tocchi ================= */
function setPath(k,v){if(k.startsWith('plan.'))S.plan[k.slice(5)]=v;else S[k]=v}
const getPath=k=>k.startsWith('plan.')?S.plan[k.slice(5)]:S[k];
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const [a,x,y]=el.dataset.a.split(':');const n=+x;
  if(swDragged){swDragged=false;return}
  if(swOpen&&!el.closest('.sw.open .del')){const inRow=el.closest('.sw');closeSw();if(inRow)return}
  switch(a){
    case 'tab':nav(isNaN(n)?x:TABS[n][0]);break;
    case 'st':nav('studia',STUDY[n][0]);break;
    case 'nav':nav(x);break;
    case 'qt':if(S.quizTab===n)break;S.quizTab=n;setSg('qt',n);swapBody('qbody',qBody());break;
    case 'gk':S.genKind=n;setSg('gk',n);S.genN=n?15:8;{const r=$('#g-n');r.min=n?5:3;r.max=n?40:20;r.value=S.genN;$('#g-nv').textContent=S.genN;r.previousElementSibling.firstChild.textContent=(n?'Numero di flashcard':'Numero di domande')+': '}break;
    case 'ag':if(S.agTab===n)break;S.agTab=n;setSg('ag',n);swapBody('agbody',agBody());requestAnimationFrame(()=>placeWeek(false));break;
    case 'vp':if(S.vperiod===n)break;S.vperiod=n;setSg('vp',n);swapBody('vbody',vBody());break;
    case 'ft':case 'fw':case 'th':case 'mo':case 'acc':
      setSg(a,n);
      if(a==='th'){S.theme=['notte','giorno','auto'][n];app.className='app '+themeClass()+(still()?' still':'');savePrefs()}
      if(a==='mo'){S.motion=['auto','complete','nessuna'][n];app.classList.toggle('still',still());savePrefs()}
      if(a==='acc'){S.data=n?'dati':'vuoto';seed();refresh()}
      break;
    case 'day':if(S.day===n)break;S.day=n;$$('#week .wd').forEach(b=>b.setAttribute('aria-pressed',b.dataset.a==='day:'+n));placeWeek(true);
      {const dl=dayList();$('#dayh').innerHTML=dl.h;swapBody('dayl',dl.l)}break;
    case 'wk':{const old=S.week;S.week=n===0?0:S.week+n;if(S.week===old)break;S.day=S.week===0?T:7*S.week;const dir=Math.sign(S.week-old),b=$('#agbody');
      anim(b,[{opacity:1,transform:'none'},{opacity:0,transform:`translateX(${-8*dir}px)`}],{duration:140,easing:EI,fill:'forwards'}).finished.then(()=>{b.innerHTML=agBody();placeAll();placeWeek(false);b.getAnimations().forEach(a=>a.cancel());anim(b,[{opacity:0,transform:`translateX(${10*dir}px)`},{opacity:1,transform:'none'}],{duration:300,easing:EO})})}break;
    case 'goday':S.agTab=0;S.day=n;S.week=Math.floor(n/7);nav('agenda');break;
    case 'mv':if(S.mapView===n)break;S.mapView=n;setSg('mv',n);swapBody('mbody',mBody());break;
    case 'zoom':{const cx=170,cy=106;if(n===0){Z.s=1;Z.x=0;Z.y=0}else{const ns=Math.max(1,Math.min(3,Z.s*(n>0?1.4:1/1.4)));Z.x=cx-(cx-Z.x)*ns/Z.s;Z.y=cy-(cy-Z.y)*ns/Z.s;Z.s=ns;if(ns===1){Z.x=0;Z.y=0}}applyZ()}break;
    case 'del-sheet':closeSheet();setTimeout(()=>delRow(x,y),D(240));break;
    case 'doc-quiz':closeSheet();S.quizTab=0;S.genKind=0;S.genDoc=n;setTimeout(()=>{if(S.tab==='studia'&&S.study==='quiz'){refresh()}else nav('studia','quiz')},D(220));break;
    case 'doc-map':closeSheet();S.mapView=0;setTimeout(()=>{nav('studia','mappe');toast('Preparo la mappa del documento: la trovi qui tra poco')},D(220));break;
    case 'tg':{S[x]=!S[x];const ex=$(`[data-ex="${x}"]`);el.setAttribute('aria-expanded',S[x]);ex.classList.toggle('open',S[x]);const c=ex.firstElementChild;c.inert=!S[x];
      if(S[x])anim(c,[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:250,easing:EO});}break;
    case 'sw':{const v=!getPath(x);setPath(x,v);$$(`[data-a="sw:${x}"]`).forEach(b=>b.setAttribute('aria-checked',v))}break;
    case 'done':toggleSess(x);break;
    case 'vote-no':S.vote=false;hideBlock($('[data-blk="vote"]'));toast('Te lo richiedo domani',()=>{S.vote=true;refresh();$('#toast').classList.remove('on')});break;
    case 'sheet':openSheet(x,y);break;
    case 'settings':openSheet('impostazioni',x);break;
    case 'push':push(x);break;
    case 'back':pop();break;
    case 'close':closeSheet();break;
    case 'upload':$('#file').click();break;
    case 'del':delRow(x,y);break;
    case 'undo':{const t=$('#toast');t._undo&&t._undo();t._undo=null}break;
    case 'gen':gen(el);break;
    case 'fc-flip':if(fcDragged){fcDragged=false;break}fcFlip();break;
    case 'fc-ans':fcAns(n);break;
    case 'fc-reset':S.fcI=0;S.fcKnown=0;S.fcFlip=false;swapBody('qbody',qBody());break;
    case 'node':if(mapDragged){mapDragged=false;break}S.mapSel=S.mapSel===n?null:n;if(S.mapView===0){$('#mbody').innerHTML=mBody()}else{$$('.map .n').forEach((g,i)=>g.classList.toggle('on',i===S.mapSel));$('#mapinfo').innerHTML=mapInfo()}break;
    case 'newmap':toast('Scegli i documenti per la nuova mappa');break;
    case 'toast':toast(x);break;
    case 'pick-subj':S.subject=S.subjects[n];bind();Z.s=1;Z.x=0;Z.y=0;closeSheet();setTimeout(()=>{const c=$('.chip');c.querySelector('span:nth-child(2)').textContent=S.subject;c.querySelector('.dot').style.background=subjColor(S.subject);c.setAttribute('aria-label',`Materia: ${S.subject}. Cambia`);
      const v=$('#view');anim(v,[{opacity:1},{opacity:0}],{duration:120,easing:EI,fill:'forwards'}).finished.then(()=>{refresh();anim($('#view'),[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:250,easing:EO})})},D(200));break;
    case 'add-subj':{const i=$('#new-subj'),t=i.value.trim();if(!t){i.focus();break}if(!S.subjects.includes(t)){S.subjects.push(t);DB[t]={docs:[],grades:[],books:[],sessions:[],quizzes:[]}}i.value='';$('#slist').outerHTML=SP.materie().split('<div class="row">')[0];toast(`Materia aggiunta: ${t}`)}break;
    case 'pl':S.pomo=n;$$('[data-a^="pl:"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.a==='pl:'+n));break;
    case 'pd':{const i=S.plan.days.indexOf(n);i<0?S.plan.days.push(n):S.plan.days.splice(i,1);el.setAttribute('aria-pressed',i<0)}break;
    case 'save-plan':closeSheet();toast(`Piano ricalcolato: ${S.plan.budget} minuti al giorno, ${S.plan.days.length} giorni`);break;
    case 'save-voto':saveVoto();break;
    case 'save-evento':{const t=$('#e-t');if(!t.value.trim()){t.classList.add('bad');t.focus();break}
      {const d=Math.round((new Date(($('#e-d').value||isoOf(nd(6)))+'T12:00')-MON)/864e5);S.events.push({id:Date.now(),t:t.value.trim(),k:$('#e-k').value,m:$('#e-s').value||S.subject,d,s:$('#e-i').value,past:d<T})}closeSheet();setTimeout(()=>{if(S.tab==='agenda'||S.tab==='oggi')refresh();toast('Evento salvato in Agenda')},D(200))}break;
    case 'save-lezione':{const d=+$('#l-g').value;S.lessons.push({d,s:$('#l-i').value,e:$('#l-f').value,m:S.subject,aula:$('#l-a').value||'—',doc:$('#l-d').value||'—'});closeSheet();setTimeout(()=>{if(S.tab==='agenda')refresh();toast('Lezione aggiunta all\'orario')},D(200))}break;
    case 'save-libro':{const t=$('#b-t').value.trim(),p=+$('#b-n').value,er=$('#b-err');if(!t||!(p>0)){er.hidden=false;er.textContent=!t?'Scrivi il titolo del libro.':'Scrivi quante pagine ha.';break}
      S.books.push({id:Date.now(),t,a:$('#b-a').value||'—',tot:p,at:Math.min(p,+$('#b-g').value||0)});closeSheet();setTimeout(()=>{if(S.tab==='studia')S.study==='biblioteca'?refresh():nav('studia','biblioteca');toast('Libro aggiunto: il piano lo include')},D(200))}break;
    case 'step':{const i=$('#sg-p');i.value=Math.max(+i.min,Math.min(+i.max,(+i.value||0)+n))}break;
    case 'save-seg':{const b=S.books.find(q=>q.id==x),v=Math.max(0,Math.min(b.tot,+$('#sg-p').value||0));b.at=v;closeSheet();
      setTimeout(()=>{rollTo($(`[data-roll="bk${b.id}"]`),String(v));progTo($(`[data-prog="book${b.id}"]`),v/b.tot);toast(`Segnalibro a pagina ${v}`)},D(200))}break;
    case 'pomo-pause':PM.run=!PM.run;el.innerHTML=PM.run?ic('pause',18)+'Pausa':ic('play',18)+'Riprendi';break;
    case 'pomo-stop':clearInterval(PM.t);finishPomo();break;
    case 'q-opt':qPick(n);break;
    case 'q-next':qNext();break;
    case 'q-again':Q.i=0;Q.pick=null;Q.right=0;$('#qr').innerHTML=qHTML('qin');$('#qf').innerHTML=qFoot();break;
    case 'reset-demo':S.data='dati';seed();closeSheet();setTimeout(()=>{refresh();toast('Dati di esempio ripristinati')},D(220));break;
    case 'copymail':{const m='studyrag.supporto@gmail.com',ok=()=>toast('Indirizzo copiato'),fb=()=>{const r=document.createRange(),e=$('#mailTxt');if(e){r.selectNodeContents(e);const g=getSelection();g.removeAllRanges();g.addRange(r)}toast('Seleziona e copia: '+m)};
      try{navigator.clipboard.writeText(m).then(ok,fb)}catch(_){fb()}}break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#layer').classList.contains('open'))closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-a]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.in;
  if(k==='genN'){S.genN=+e.target.value;$('#g-nv').textContent=S.genN}
  if(k==='budget'){S.plan.budget=+e.target.value;$('#pl-bv').textContent=S.plan.budget+' min'}
  if(k==='q'){S.q=e.target.value;$('#dlist').innerHTML=docRows()}
  if(k==='name'){S.name=e.target.value.trim()||'Beatrice';savePrefs()}
  if(e.target.id==='f-voto'){const v=parseVoto(e.target.value),h=$('#f-voto-h');e.target.classList.remove('bad');
    if(!e.target.value.trim()){h.className='hint';h.textContent='Vanno bene anche 7-, 6.5 e 10 e lode.'}
    else if(v==null){h.className='hint';h.textContent='Continua a scrivere…'}else{h.className='ok-t';h.textContent=`Conta come ${fmt(v)} nella media.`}}
  if(e.target.classList.contains('bad')&&e.target.value)e.target.classList.remove('bad');
});
$('#file').addEventListener('change',e=>{
  const fs=[...e.target.files];if(!fs.length)return;
  fs.forEach(f=>S.docs.unshift({id:Date.now()+Math.random(),n:f.name,m:'Elaboro il documento…',k:/\.(png|jpe?g|webp|gif|bmp|tiff)$/i.test(f.name)?'img':'file',busy:true}));
  e.target.value='';
  const go=()=>{refresh();setTimeout(()=>{S.docs.forEach(d=>{if(d.busy){d.busy=false;d.m=d.k==='img'?'Immagine · 2 blocchi':`${Math.max(1,Math.round(fs[0].size/40000))} pagine · ${Math.max(3,Math.round(fs[0].size/12000))} blocchi`}});refresh();toast(fs.length===1?'Documento pronto per quiz e mappe':`${fs.length} documenti pronti`)},D(1400)||400)};
  if(S.tab!=='archivio'){nav('archivio');setTimeout(go,D(500))}else go();
});

/* righe con scorrimento verso sinistra */
let swOpen=null,swDragged=false,fcDragged=false,mapDragged=false;
const applyZ=()=>{const g=$('#mg');if(g)g.style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`};
/* flashcard girata: si trascina, a destra «la sapevo», a sinistra no */
function dragCard(e,f){const x0=e.clientX;let dx=0,on=false;
  const mv=ev=>{dx=ev.clientX-x0;if(!on&&Math.abs(dx)>8){on=true;f.classList.add('drag')}if(on)f.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);if(!on)return;fcDragged=true;setTimeout(()=>fcDragged=false,0);
    if(Math.abs(dx)>90){fcAns(dx>0?1:0,dx)}else{f.classList.remove('drag');anim(f,[{transform:f.style.transform},{transform:'none'}],{duration:250,easing:EO});f.style.transform=''}};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)}
/* mappa: trascina per spostarti */
function panMap(e,m){const x0=e.clientX,y0=e.clientY,zx=Z.x,zy=Z.y,u=340/m.clientWidth;let on=false;
  const mv=ev=>{const dx=ev.clientX-x0,dy=ev.clientY-y0;if(!on&&Math.hypot(dx,dy)>6){on=true;m.classList.add('pan')}if(on){Z.x=zx+dx*u;Z.y=zy+dy*u;applyZ()}};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);m.classList.remove('pan');if(on){mapDragged=true;setTimeout(()=>mapDragged=false,0)}};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)}
function closeSw(){if(swOpen){$('.li',swOpen).style.transform='';swOpen.classList.remove('open');$('.del',swOpen).tabIndex=-1;swOpen=null}}
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('.grab,.shh'))return dragSheet(e);
  const fc=e.target.closest('#fc');if(fc&&S.fcFlip)return dragCard(e,fc);
  const mp=e.target.closest('#map');if(mp&&!e.target.closest('.zm,.n'))return panMap(e,mp);
  const li=e.target.closest('.sw>.li');if(!li)return;const sw=li.parentElement;
  const x0=e.clientX,y0=e.clientY,base=sw.classList.contains('open')?-96:0;let dx=0,on=false;
  const mv=ev=>{const mx=ev.clientX-x0,my=ev.clientY-y0;if(!on){if(Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)){on=true;sw.classList.add('drag');if(swOpen&&swOpen!==sw)closeSw()}else if(Math.abs(my)>8){end();return}else return}
    dx=Math.max(-96,Math.min(0,base+mx));li.style.transform=`translateX(${dx}px)`};
  const end=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',end);removeEventListener('pointercancel',end);sw.classList.remove('drag');if(!on)return;swDragged=true;setTimeout(()=>swDragged=false,0);
    if(dx<-48){li.style.transform='translateX(-96px)';sw.classList.add('open');$('.del',sw).tabIndex=0;swOpen=sw}else{li.style.transform='';sw.classList.remove('open');if(swOpen===sw)swOpen=null}};
  addEventListener('pointermove',mv);addEventListener('pointerup',end);addEventListener('pointercancel',end);
});

/* ================= preferenze (tema, animazioni, nome) ================= */
function savePrefs(){try{localStorage.setItem(PREF,JSON.stringify({theme:S.theme,motion:S.motion,name:S.name}))}catch(_){}}
(function(){try{const p=JSON.parse(localStorage.getItem(PREF)||'{}');if(['notte','giorno','auto'].includes(p.theme))S.theme=p.theme;if(['auto','complete','nessuna'].includes(p.motion))S.motion=p.motion;if(p.name)S.name=String(p.name).slice(0,30)}catch(_){}})();
const side=()=>{};
function fitDevice(){const d=$('#dev');d.classList.toggle('full',innerWidth<=560)}
addEventListener('resize',()=>{fitDevice();app.style.setProperty('--band',$('.band',app).offsetHeight+'px');placeAll();placeWeek(false)});
if(window.matchMedia){matchMedia('(prefers-reduced-motion: reduce)').addEventListener?.('change',()=>app.classList.toggle('still',still()));
  matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{if(S.theme==='auto'){app.className='app '+themeClass()+(still()?' still':'')}})}
fitDevice();render();
document.fonts&&document.fonts.ready.then(()=>{placeAll();placeWeek(false)});
</script>
</html>
